# Fork releases are deliberately not inherited from upstream's release event.
# After CI succeeds on the exact commit, the maintainer downloads its five build
# artifacts, verifies them, and creates a prerelease with checksums using gh.
name: Publish (disabled in fork)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Fork publication is manual and requires successful CI on the exact release commit. See CONTRIBUTING.md.'
