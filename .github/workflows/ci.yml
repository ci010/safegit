name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: protocol.file.allow
  GIT_CONFIG_VALUE_0: always
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Avoid the macOS arm64 hosted pool, which failed to acquire runners.
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... ${{ runner.os == 'Linux' && '-race' || '' }} -count=1 -timeout=40m
  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: ./scripts/test-windows-inventory.ps1
      - shell: pwsh
        run: |
          $packages = @(go list ./... | Where-Object { $_ -ne 'github.com/stricttools/safegit/internal/test' })
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test $packages -count=1 -timeout=35m
          exit $LASTEXITCODE
  windows-integration:
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: ./scripts/test-windows-integration.ps1 -Shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tests-${{ matrix.shard }}
          path: .strictmetadata/validation/windows-integration-*
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, goos: linux, goarch: amd64}
          - {os: ubuntu-latest, goos: linux, goarch: arm64}
          - {os: ubuntu-latest, goos: darwin, goarch: amd64}
          - {os: ubuntu-latest, goos: darwin, goarch: arm64}
          - {os: windows-latest, goos: windows, goarch: amd64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - shell: bash
        run: |
          set -euo pipefail
          version=0.33.0-windows.1
          binary=safegit
          if [ "$GOOS" = windows ]; then binary=safegit.exe; fi
          mkdir -p dist/stage
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/stage/$binary" .
          cp LICENSE dist/stage/LICENSE
          tar -czf "dist/safegit_${version}_${GOOS}_${GOARCH}.tar.gz" -C dist/stage "$binary" LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: safegit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
